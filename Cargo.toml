[package]
name = "plc-mint"
version = "0.1.0"
edition = "2024"
description = "Grind vanity did:plc identifiers on your CPU or Apple GPU"
license = "MIT"
repository = "https://github.com/socialdept/plc-mint"

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"

[dev-dependencies]
k256 = { version = "0.13", features = ["expose-field"] }
secp256k1 = { version = "0.29", features = ["global-context"] }
serde_ipld_dagcbor = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
# Metal GPU backend (macOS).
gpu = ["dep:metal"]
# Compiles the GPU kernel as C++ for the CPU so its math can be tested anywhere.
gpu-ref = ["dep:cc"]

# Crypto in debug builds is unbearably slow; optimize dependencies even in tests.
[profile.dev.package."*"]
opt-level = 3

# sha2 only uses the ARMv8 SHA-256 instructions (Apple Silicon, Graviton) with `asm`.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
