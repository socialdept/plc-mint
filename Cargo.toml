[package]
name = "plc-mint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"

[dev-dependencies]
secp256k1 = { version = "0.29", features = ["global-context"] }
serde_ipld_dagcbor = "0.7.0"

# Crypto in debug builds is unbearably slow; optimize dependencies even in tests.
[profile.dev.package."*"]
opt-level = 3

# sha2 only uses the ARMv8 SHA-256 instructions (Apple Silicon, Graviton) with `asm`.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
